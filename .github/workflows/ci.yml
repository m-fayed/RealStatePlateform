name: Release baseline

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: my-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            my-marketplace/package-lock.json
            my-marketplace/server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx prisma generate
        working-directory: my-marketplace/server
        env:
          DATABASE_URL: file:./ci.db
      - run: npm run lint
      - run: npm run lint --prefix server
      - run: npm test
      - run: npm test --prefix server
